name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Back end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev,live]"
      - run: python -m ruff check .
      # Runs in mock mode. Tests that need the real archive are skipped unless SM_RUN_LIVE=1.
      - run: python -m pytest -q

  frontend:
    name: Front end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run gen:api
      - name: API types match the contract
        run: git diff --exit-code -- src/api-types.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
